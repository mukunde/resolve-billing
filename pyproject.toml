[project]
name = "resolve-billing"
version = "0.1.0"
description = "Provider- and model-agnostic agentic workflow for investigating billing disputes and safely recommending corrective actions."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
]
claude = [
    "anthropic>=0.40",
]
# Stripe as a billing platform, read-only (specs/001-stripe-read-adapter).
# Pinned exactly: the adapter pins the API version this release targets
# (2026-07-29.dahlia), and its payload tests are written to it.
stripe = [
    "stripe==15.4.0",
]
# Optional on purpose: the MCP server is a second face on the billing port,
# not something the API or the tests need in order to run.
mcp = [
    "mcp>=2.0",
]
# OpenTelemetry GenAI instrumentation. HTTP rather than gRPC on purpose:
# Langfuse -- one of the backends this can export to -- does not accept gRPC.
otel = [
    "opentelemetry-api>=1.44",
    "opentelemetry-sdk>=1.44",
    "opentelemetry-exporter-otlp-proto-http>=1.44",
    "opentelemetry-semantic-conventions>=0.65b0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# Lets `pytest` run straight from a clone, with no editable install.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "contract: a property of the billing port, checked against every platform",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Spec Kit's own scripts, rewritten by `specify` on every refresh: linting
# them would mean editing vendored files that the next upgrade overwrites.
extend-exclude = [".specify/scripts", ".specify/extensions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
