[project]
name = "agentic-billing-exception-handler"
version = "0.1.0"
description = "Provider- and model-agnostic agentic workflow for investigating billing disputes and safely recommending corrective actions."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.9",
]
claude = [
    "anthropic>=0.40",
]
# Optional on purpose: the MCP server is a second face on the billing port,
# not something the API or the tests need in order to run.
mcp = [
    "mcp>=2.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# Lets `pytest` run straight from a clone, with no editable install.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
