<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 828"
     width="1080" height="828" role="img" aria-label="Architecture and flow of the billing exception handler: a dispute arrives through n8n, the application loads the billing context, runs deterministic rules, asks a decision engine only when the rules cannot settle it, and an action policy decides whether a person must approve. A prompt injection bypasses the engine entirely. Billing providers, decision engines and usage reports sit behind ports, with unimplemented adapters marked roadmap.">
  <style>
    text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,
         Helvetica,Arial,sans-serif;text-anchor:middle}
    .h1{font-size:23px;font-weight:600}
    .h2{font-size:13.5px}
    .l{text-anchor:start}
    .r{text-anchor:end}
    .step{font-size:12px;font-weight:600}
    .bt{font-size:14px;font-weight:600}
    .bs{font-size:11px}
    .lane{font-size:10px;font-weight:600;letter-spacing:.09em}
    .band{font-size:15px;font-weight:600}
    .pt{font-size:15px;font-weight:600}
    .chip{font-size:11px;font-weight:600}
    .tiny{font-size:10.5px}
    .pr{font-size:13px;font-weight:600}
</style>
  <defs><marker id="aaab2bb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#aab2bb"/></marker><marker id="a004D40" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#004D40"/></marker><marker id="aC2185B" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C2185B"/></marker><marker id="a9a6700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a6700"/></marker><marker id="a57606a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/></marker><marker id="a0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#0969da"/></marker><marker id="a1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/></marker></defs>
  <rect width="1080" height="828" rx="12" fill="#fbfcfd" stroke="#d8dee4"/>
  <text class="h1" x="540.0" y="40" fill="#1f2328">Agentic Billing Exception Handler</text><text class="h2" x="540.0" y="65" fill="#6e7781">One dispute, end to end: what code settles, what a model reads, and what a person signs for</text><text class="step l" x="40" y="110" fill="#6e7781">1. Arrives</text><text class="step l" x="205" y="110" fill="#6e7781">2. Orchestrate</text><text class="step l" x="370" y="110" fill="#6e7781">3. Entry point</text><text class="step l" x="535" y="110" fill="#6e7781">4. Investigate</text><rect x="40" y="132" width="145" height="74" rx="9" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5"/><text class="bt" x="112.5" y="166.0" fill="#1f2328">Dispute</text><text class="bs" x="112.5" y="185.0" fill="#6e7781">webhook or mail</text><rect x="205" y="132" width="145" height="74" rx="9" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5"/><text class="bt" x="277.5" y="166.0" fill="#1f2328">n8n</text><text class="bs" x="277.5" y="185.0" fill="#6e7781">trigger, notify</text><rect x="370" y="132" width="145" height="74" rx="9" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5"/><text class="bt" x="442.5" y="166.0" fill="#1f2328">Billing API</text><text class="bs" x="442.5" y="185.0" fill="#6e7781">FastAPI</text><line x1="185" y1="169.0" x2="205" y2="169.0" stroke="#aab2bb" stroke-width="1.8" marker-end="url(#aaab2bb)"/><line x1="350" y1="169.0" x2="370" y2="169.0" stroke="#aab2bb" stroke-width="1.8" marker-end="url(#aaab2bb)"/><line x1="515" y1="169.0" x2="535" y2="169.0" stroke="#aab2bb" stroke-width="1.8" marker-end="url(#aaab2bb)"/><rect x="535" y="106" width="505" height="118" rx="11" fill="#f4f7fa" stroke="#004D40" stroke-width="1.5"/><text class="lane l" x="551" y="123" fill="#004D40" >DISPUTEINVESTIGATOR &#183; THE APPLICATION LAYER</text><rect x="551" y="136" width="112" height="66" rx="9" fill="#ffffff" stroke="#004D40" stroke-width="1.5"/><text class="bt" x="607.0" y="166.0" fill="#1f2328">Load context</text><text class="bs" x="607.0" y="185.0" fill="#6e7781">once, in full</text><rect x="674" y="136" width="112" height="66" rx="9" fill="#ffffff" stroke="#004D40" stroke-width="1.5"/><text class="bt" x="730.0" y="166.0" fill="#1f2328">Rules</text><text class="bs" x="730.0" y="185.0" fill="#6e7781">5 checks, 0 tokens</text><line x1="662" y1="169.0" x2="672" y2="169.0" stroke="#004D40" stroke-width="1.8" marker-end="url(#a004D40)"/><rect x="797" y="136" width="112" height="66" rx="9" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5" stroke-dasharray="5 4"/><text class="bt" x="853.0" y="166.0" fill="#6e7781">Decision engine</text><text class="bs" x="853.0" y="185.0" fill="#6e7781">1 call, typed</text><line x1="785" y1="169.0" x2="795" y2="169.0" stroke="#004D40" stroke-width="1.8" marker-end="url(#a004D40)"/><rect x="920" y="136" width="112" height="66" rx="9" fill="#ffffff" stroke="#004D40" stroke-width="1.5"/><text class="bt" x="976.0" y="166.0" fill="#1f2328">Action policy</text><text class="bs" x="976.0" y="185.0" fill="#6e7781">authorises</text><line x1="908" y1="169.0" x2="918" y2="169.0" stroke="#004D40" stroke-width="1.8" marker-end="url(#a004D40)"/><path d="M 786 144 C 816 98, 890 98, 920 144" fill="none" stroke="#C2185B" stroke-width="2" marker-end="url(#aC2185B)"/><text class="tiny" x="853.0" y="94" fill="#C2185B">prompt injection &#8594; the engine is never asked</text><text class="step l" x="40" y="256" fill="#6e7781">5. Outcome</text><rect x="30" y="268" width="320" height="62" rx="9" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text class="bt" x="190.0" y="296.0" fill="#57606a">Automatic reply</text><text class="bs" x="190.0" y="315.0" fill="#6e7781">no money moves</text><line x1="787.5" y1="226" x2="190.0" y2="264" stroke="#aab2bb" stroke-width="1.8" marker-end="url(#aaab2bb)"/><rect x="380" y="268" width="320" height="62" rx="9" fill="#ffffff" stroke="#0969da" stroke-width="1.5"/><text class="bt" x="540.0" y="296.0" fill="#0969da">Ask the customer</text><text class="bs" x="540.0" y="315.0" fill="#6e7781">which invoice is unclear</text><line x1="787.5" y1="226" x2="540.0" y2="264" stroke="#aab2bb" stroke-width="1.8" marker-end="url(#aaab2bb)"/><rect x="730" y="268" width="320" height="62" rx="9" fill="#ffffff" stroke="#9a6700" stroke-width="1.5"/><text class="bt" x="890.0" y="296.0" fill="#9a6700">Financial action proposed</text><text class="bs" x="890.0" y="315.0" fill="#6e7781">nothing has happened yet</text><line x1="787.5" y1="226" x2="890.0" y2="264" stroke="#9a6700" stroke-width="1.8" marker-end="url(#a9a6700)"/><text class="step l" x="42" y="376" fill="#6e7781">6. Act, only after a person says so</text><rect x="42" y="388" width="240" height="62" rx="9" fill="#ffffff" stroke="#004D40" stroke-width="1.5"/><text class="bt" x="162.0" y="416.0" fill="#004D40">Human approval</text><text class="bs" x="162.0" y="435.0" fill="#6e7781">on a page we serve</text><rect x="304" y="388" width="240" height="62" rx="9" fill="#ffffff" stroke="#004D40" stroke-width="1.5"/><text class="bt" x="424.0" y="416.0" fill="#004D40">Execute once</text><text class="bs" x="424.0" y="435.0" fill="#6e7781">derived idempotency key</text><line x1="281" y1="419" x2="302" y2="419" stroke="#004D40" stroke-width="1.8" marker-end="url(#a004D40)"/><rect x="566" y="388" width="240" height="62" rx="9" fill="#ffffff" stroke="#57606a" stroke-width="1.5"/><text class="bt" x="686.0" y="424.0" fill="#57606a">Customer notified</text><line x1="543" y1="419" x2="564" y2="419" stroke="#004D40" stroke-width="1.8" marker-end="url(#a004D40)"/><rect x="828" y="388" width="240" height="62" rx="9" fill="#ffffff" stroke="#1a7f37" stroke-width="1.5"/><text class="bt" x="948.0" y="416.0" fill="#1a7f37">99,00 € credit note</text><text class="bs" x="948.0" y="435.0" fill="#6e7781">provider ref cn_001</text><line x1="805" y1="419" x2="826" y2="419" stroke="#004D40" stroke-width="1.8" marker-end="url(#a004D40)"/><line x1="890.0" y1="330" x2="162.0" y2="384" stroke="#9a6700" stroke-width="1.8" marker-end="url(#a9a6700)"/><rect x="42" y="480" width="996" height="52" rx="9" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5"/><text class="bt l" x="72" y="511" fill="#1f2328">Audit + state</text><text class="bs l" x="212" y="511" fill="#6e7781">runs &#183; events &#183; pending actions &#183; SQLite &#8212; traceable, reproducible, attributable</text><line x1="787.5" y1="226" x2="950" y2="476" stroke="#aab2bb" stroke-width="1.8" marker-end="url(#aaab2bb)"/><text class="tiny r" x="1038" y="468" fill="#aab2bb">written by the application, one way</text><rect x="30" y="526" width="1020" height="182" rx="11" fill="#f4f7fa" stroke="#d8dee4" stroke-width="1.5"/><text class="band" x="540.0" y="548" fill="#1f2328">The application depends on contracts, not on vendors</text><rect x="45" y="560" width="314" height="132" rx="9" fill="#ffffff" stroke="#004D40" stroke-width="1.5"/><text class="pt" x="202.0" y="586" fill="#004D40">BillingProvider</text><text class="tiny l" x="59" y="608" fill="#6e7781">built</text><rect x="59" y="614" width="144.0" height="23" rx="5" fill="#eef6f4" stroke="#004D40" stroke-width="1"/><text class="chip" x="131.0" y="630" fill="#004D40">FakeBillingProvider</text><text class="tiny l" x="59" y="654" fill="#aab2bb">roadmap &#8212; not implemented</text><rect x="59" y="662" width="50.599999999999994" height="21" rx="5" fill="none" stroke="#aab2bb" stroke-width="1" stroke-dasharray="4 3"/><text class="chip" x="84.3" y="677" fill="#aab2bb">Stripe</text><rect x="115.6" y="662" width="44.0" height="21" rx="5" fill="none" stroke="#aab2bb" stroke-width="1" stroke-dasharray="4 3"/><text class="chip" x="137.6" y="677" fill="#aab2bb">Zuora</text><rect x="165.6" y="662" width="63.8" height="21" rx="5" fill="none" stroke="#aab2bb" stroke-width="1" stroke-dasharray="4 3"/><text class="chip" x="197.5" y="677" fill="#aab2bb">OpenCell</text><rect x="383" y="560" width="314" height="132" rx="9" fill="#ffffff" stroke="#004D40" stroke-width="1.5"/><text class="pt" x="540.0" y="586" fill="#004D40">DecisionEngine</text><text class="tiny l" x="397" y="608" fill="#6e7781">built</text><rect x="397" y="614" width="39.0" height="23" rx="5" fill="#eef6f4" stroke="#004D40" stroke-width="1"/><text class="chip" x="416.5" y="630" fill="#004D40">Mock</text><rect x="443.0" y="614" width="53.0" height="23" rx="5" fill="#eef6f4" stroke="#004D40" stroke-width="1"/><text class="chip" x="469.5" y="630" fill="#004D40">Claude</text><text class="tiny l" x="397" y="654" fill="#aab2bb">roadmap &#8212; not implemented</text><rect x="397" y="662" width="30.799999999999997" height="21" rx="5" fill="none" stroke="#aab2bb" stroke-width="1" stroke-dasharray="4 3"/><text class="chip" x="412.4" y="677" fill="#aab2bb">Jev</text><rect x="433.8" y="662" width="50.599999999999994" height="21" rx="5" fill="none" stroke="#aab2bb" stroke-width="1" stroke-dasharray="4 3"/><text class="chip" x="459.1" y="677" fill="#aab2bb">Vertex</text><rect x="721" y="560" width="314" height="132" rx="9" fill="#ffffff" stroke="#004D40" stroke-width="1.5"/><text class="pt" x="878.0" y="586" fill="#004D40">UsageReport</text><text class="tiny l" x="735" y="608" fill="#6e7781">built</text><rect x="735" y="614" width="88.0" height="23" rx="5" fill="#eef6f4" stroke="#004D40" stroke-width="1"/><text class="chip" x="779.0" y="630" fill="#004D40">File export</text><text class="tiny l" x="735" y="654" fill="#aab2bb">roadmap &#8212; not implemented</text><rect x="735" y="662" width="77.0" height="21" rx="5" fill="none" stroke="#aab2bb" stroke-width="1" stroke-dasharray="4 3"/><text class="chip" x="773.5" y="677" fill="#aab2bb">Admin API*</text><text class="tiny r" x="1038" y="732" fill="#aab2bb">* written against the documented shape, never run: the endpoint rejects workspace-scoped keys</text><rect x="30" y="762" width="320" height="42" rx="21" fill="#ffffff" stroke="#004D40" stroke-width="1.4"/><text class="pr" x="190.0" y="789" fill="#004D40">Deterministic before probabilistic</text><rect x="380" y="762" width="320" height="42" rx="21" fill="#ffffff" stroke="#C2185B" stroke-width="1.4"/><text class="pr" x="540.0" y="789" fill="#C2185B">A person signs for money</text><rect x="730" y="762" width="320" height="42" rx="21" fill="#ffffff" stroke="#57606a" stroke-width="1.4"/><text class="pr" x="890.0" y="789" fill="#57606a">Provider and engine interchangeable</text>
</svg>
