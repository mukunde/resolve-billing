.l{font:400 10.5px system-ui,-apple-system,Segoe UI,sans-serif}
</style><rect width="1000" height="590" fill="#ffffff"/><text class="h1" x="500.0" y="34" fill="#1f2328" text-anchor="middle">Where ResolveBilling sits</text><text class="h2" x="500.0" y="56" fill="#6e7781" text-anchor="middle">a dispute in, the billing platform, the bank and a model around it -- a person signs for every movement of money</text><rect x="30" y="100" width="140" height="66" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5"/><text class="t" x="100" y="128" fill="#1f2328" text-anchor="middle">Customer</text><text class="s" x="100" y="148" fill="#6e7781" text-anchor="middle">writes about an invoice</text><rect x="300" y="84" width="400" height="82" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5"/><svg x="316" y="100" width="22" height="22" viewBox="0 0 24 24"><path d="M21.4737 5.6842c-1.1772 0-2.1663.8051-2.4468 1.8947h-2.8955c-1.235 0-2.289.893-2.492 2.111l-.1038.623a1.263 1.263 0 0 1-1.246 1.0555H11.289c-.2805-1.0896-1.2696-1.8947-2.4468-1.8947s-2.1663.8051-2.4467 1.8947H4.973c-.2805-1.0896-1.2696-1.8947-2.4468-1.8947C1.1311 9.4737 0 10.6047 0 12s1.131 2.5263 2.5263 2.5263c1.1772 0 2.1663-.8051 2.4468-1.8947h1.4223c.2804 1.0896 1.2696 1.8947 2.4467 1.8947 1.1772 0 2.1663-.8051 2.4468-1.8947h1.0008a1.263 1.263 0 0 1 1.2459 1.0555l.1038.623c.203 1.218 1.257 2.111 2.492 2.111h.3692c.2804 1.0895 1.2696 1.8947 2.4468 1.8947 1.3952 0 2.5263-1.131 2.5263-2.5263s-1.131-2.5263-2.5263-2.5263c-1.1772 0-2.1664.805-2.4468 1.8947h-.3692a1.263 1.263 0 0 1-1.246-1.0555l-.1037-.623A2.52 2.52 0 0 0 13.9607 12a2.52 2.52 0 0 0 .821-1.4794l.1038-.623a1.263 1.263 0 0 1 1.2459-1.0555h2.8955c.2805 1.0896 1.2696 1.8947 2.4468 1.8947 1.3952 0 2.5263-1.131 2.5263-2.5263s-1.131-2.5263-2.5263-2.5263m0 1.2632a1.263 1.263 0 0 1 1.2631 1.2631 1.263 1.263 0 0 1-1.2631 1.2632 1.263 1.263 0 0 1-1.2632-1.2632 1.263 1.263 0 0 1 1.2632-1.2631M2.5263 10.7368A1.263 1.263 0 0 1 3.7895 12a1.263 1.263 0 0 1-1.2632 1.2632A1.263 1.263 0 0 1 1.2632 12a1.263 1.263 0 0 1 1.2631-1