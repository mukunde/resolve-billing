.9782c1.7376 0 3.177 1.3651 3.2087 3.043.016.84-.2994 1.633-.8878 2.2324-.5886.5998-1.375.9303-2.2144.9303H9.2322a.2756.2756 0 0 0-.2755.2752v3.431c0 .0585.018.1142.052.1612L16.2646 24h5.3114l-7.2727-10.094c3.6625-.1838 6.61-3.2612 6.61-6.9494zM6.8943 5.9229H2.424V24h4.4704z" fill="#191C1F"/></svg><text class="c" x="888" y="421" fill="#1f2328" text-anchor="start">Revolut</text><line x1="750" y1="372" x2="818" y2="395" stroke="#aab2bb" stroke-width="1.6" marker-end="url(#head)"/><text class="s" x="784" y="412" fill="#6e7781" text-anchor="middle">read only</text><text class="l" x="30" y="572" fill="#6e7781" text-anchor="start">Solid: built and tested (test mode or sandbox for real platforms). Dashed: being built or a target. Arrows: the direction of the call. Marks: Simple Icons (CC0), their owners' trademarks; no partnership implied.</text></svg>
