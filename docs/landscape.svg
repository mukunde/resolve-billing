0" rx="8" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5"/><text class="s" x="500" y="386" fill="#1f2328" text-anchor="middle">Audit trail: every run that completes, its findings, decisions, approvals</text><line x1="470" y1="166" x2="470" y2="194" stroke="#aab2bb" stroke-width="1.6" marker-end="url(#head)"/><line x1="530" y1="194" x2="530" y2="168" stroke="#aab2bb" stroke-width="1.6" marker-end="url(#head)"/><line x1="220" y1="388" x2="248" y2="360" stroke="#aab2bb" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#head)"/><rect x="330" y="456" width="340" height="90" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5"/><text class="t" x="500" y="480" fill="#1f2328" text-anchor="middle">Model provider</text><text class="s" x="500" y="498" fill="#6e7781" text-anchor="middle">masked text, pseudonymised context, finding codes</text><rect x="350" y="510" width="158.8" height="26" rx="13" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5"/><svg x="360" y="514" width="18" height="18" viewBox="0 0 24 24"><path d="M17.3041 3.541h-3.6718l6.696 16.918H24Zm-10.6082 0L0 20.459h3.7442l1.3693-3.5527h7.0052l1.3693 3.5528h3.7442L10.5363 3.5409Zm-.3712 10.2232 2.2914-5.9456 2.2914 5.9456Z" fill="#191919"/></svg><text class="c" x="382" y="527" fill="#1f2328" text-anchor="start">Anthropic (Claude)</text><rect x="516.8" y="510" width="202.79999999999998" height="26" rx="13" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5"/><text class="c" x="526.8" y="527" fill="#1f2328" text-anchor="start">OpenAI (synthetic data only)</text><line x1="440" y1="410" x2="440" y2="454" stroke="#aab2bb" stroke-width="1.6" marker-end="url(#head)"/><rect x="820" y="196" width="160" height="134" rx="10" fill="#ffffff" stroke="#d8dee4" stroke-width="1.5"/><text class="t" x="900" y="220" fill="#1f2328" text-anchor="middle">Billing platform</text><text class="s" x="900" y="238" fill="#6e7781" text-anchor="middle">the authority on amounts</text><rect x="832" y="254" width="79.6" height="26" 