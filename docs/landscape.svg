<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-label="Where ResolveBilling sits. Today a customer's dispute arrives through n8n's webhook; a company's support tool is planned as the other way in (spec 017, in progress), by a signed webhook (Zammad; Zendesk a target), drawn dashed. ResolveBilling runs deterministic rules, asks a decision engine through a model provider -- Anthropic's Claude; OpenAI on synthetic data only -- with the masked text, a pseudonymised context and finding codes, computes the amount and its policy, and a person approves. It reads the billing platform (Stripe, Pennylane), the authority on amounts, and writes there only once approved and only where writes are enabled; it reads the bank (Revolut) as evidence only. n8n orchestrates the notifications, the wait for a person and the request to execute. Every run that completes is audited. Solid: built and tested, in test mode or on a sandbox for real platforms; dashed: being built or a target."><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#aab2bb"/></marker><marker id="head-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#004D40"/></marker><marker id="head-crimson" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C2185B"/></marker></defs><style>
