    <text class="mono" x="490.0" y="426"
          fill="#6e7781">DUPLICATE_INVOICE → credit_note 99,00 € → pending_approval → executed</text>
  </g>
  <g style="animation:hB 32.0s linear infinite;opacity:0">
    <text class="h1" x="490.0" y="36" fill="#004D40">Case B — the invoice is correct</text>
    <text class="h2" x="490.0" y="58" fill="#6e7781">two debits, both legitimate: the agent proposes nothing</text>
    <text class="mono" x="490.0" y="426"
          fill="#6e7781">no finding → valid_invoice → verdict auto → nothing is queued</text>
  </g>
  <g style="animation:hD 32.0s linear infinite;opacity:0">
